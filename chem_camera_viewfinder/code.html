<script>
  (function() {
    const shutter = document.getElementById('masterShutter');
    const flashOverlay = document.getElementById('exposureFlashOverlay');
    const shutterPulseHalo = document.getElementById('shutterPulseHalo');
    const flashBtn = document.getElementById('flashBtn');
    const flashLabel = document.getElementById('flashLabel');
    const flashIcon = document.getElementById('flashIcon');
    const proModeToggle = document.getElementById('proModeToggle');
    const lensButtons = document.querySelectorAll('.lens-btn');
    const viewfinderFeed = document.getElementById('viewfinderFeed');
    const filmBadge = document.getElementById('filmCanisterBadge');

    // Flash cycle states
    const flashModes = [
      { label: 'AUTO', icon: 'flash_auto' },
      { label: 'ON', icon: 'flash_on' },
      { label: 'OFF', icon: 'flash_off' }
    ];
    let currentFlashIndex = 0;

    if (flashBtn) {
      flashBtn.addEventListener('click', () => {
        currentFlashIndex = (currentFlashIndex + 1) % flashModes.length;
        const mode = flashModes[currentFlashIndex];
        flashLabel.textContent = mode.label;
        flashIcon.textContent = mode.icon;
      });
    }

    // Lens zoom simulation
    lensButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        lensButtons.forEach(b => {
          b.className = 'lens-btn w-9 h-9 rounded-full flex items-center justify-center font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all';
        });
        btn.className = 'lens-btn w-9 h-9 rounded-full flex items-center justify-center font-label-sm text-label-sm text-on-surface bg-surface-container-highest ring-1 ring-on-surface/20 shadow-sm transition-all';
        
        const zoom = parseFloat(btn.getAttribute('data-zoom') || '1');
        if (viewfinderFeed) {
          viewfinderFeed.style.transform = `scale(${1 + (zoom - 1) * 0.25})`;
        }
      });
    });

    // Shutter Trigger Mechanism
    if (shutter && flashOverlay) {
      shutter.addEventListener('click', () => {
        // Optical Flash transient
        flashOverlay.style.opacity = '0.9';
        shutterPulseHalo.classList.add('border-primary', 'scale-110');
        
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate(35);
        }

        setTimeout(() => {
          flashOverlay.style.opacity = '0';
          shutterPulseHalo.classList.remove('border-primary', 'scale-110');
        }, 120);
      });
    }

    // Quick carousel swipe cue on canister
    const filmProfiles = ['SKIN 400', 'GOLD 200', 'CINE 800T', 'PAN 100'];
    let filmIdx = 0;
    if (filmBadge) {
      filmBadge.addEventListener('click', () => {
        filmIdx = (filmIdx + 1) % filmProfiles.length;
        const labelEl = filmBadge.querySelector('.text-label-md');
        if (labelEl) {
          labelEl.textContent = filmProfiles[filmIdx];
        }
      });
    }

    // Pro Mode state toggle
    if (proModeToggle) {
      proModeToggle.addEventListener('click', () => {
        const dot = proModeToggle.querySelector('span');
        if (dot.classList.contains('bg-primary')) {
          dot.classList.remove('bg-primary');
          dot.classList.add('bg-on-surface-variant');
        } else {
          dot.classList.remove('bg-on-surface-variant');
          dot.classList.add('bg-primary');
        }
      });
    }
  })();
