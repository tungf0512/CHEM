name: Refresh iOS dependency lockfiles

on:
  workflow_dispatch:
  # Bootstrap only: this path is removed immediately after the macOS runner
  # commits the canonical lockfiles. Normal refreshes remain manual.
  # Resolver attempt includes the Nanaimo parser compatibility fix.
  push:
    paths:
      - ".github/workflows/ios-lockfile-refresh.yml"

permissions:
  contents: write

concurrency:
  group: ios-lockfile-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Resolve and commit iOS lockfiles
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate iOS Codegen artifacts
        working-directory: mobile
        run: npm run codegen:ios

      - name: Configure Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          working-directory: mobile
          bundler: "2.7.2"

      - name: Resolve Ruby dependencies and lock metadata
        working-directory: mobile
        run: |
          bundle _2.7.2_ lock --bundler 2.7.2
          bundle _2.7.2_ install --jobs 4 --retry 3 --verbose

      - name: Resolve CocoaPods dependencies
        working-directory: mobile
        run: |
          set +e
          bundle _2.7.2_ exec pod install --project-directory=ios 2>&1 | tee ci-pod-install.log
          pod_status=${PIPESTATUS[0]}
          set -e
          if [ "$pod_status" -ne 0 ]; then
            excerpt="$( { grep -E '^\[!\]|Error|No such|cannot|Could not|undefined' ci-pod-install.log || true; tail -n 45 ci-pod-install.log; } | tail -n 70 | tr '\r\n' ' ' | cut -c 1-3000)"
            {
              echo "## CocoaPods failure tail"
              echo
              echo '```text'
              tail -n 120 ci-pod-install.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            escaped_excerpt="$(printf '%s' "$excerpt" | sed 's/%/%25/g')"
            printf '::error title=CocoaPods resolver failure::%s\n' "$escaped_excerpt"
          fi
          exit "$pod_status"

      - name: Preserve resolver diagnostics
        if: always()
        working-directory: mobile
        run: |
          {
            echo "## Lockfile resolver diagnostics"
            echo
            ruby --version
            bundle _2.7.2_ --version
            bundle _2.7.2_ exec pod --version
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload resolver diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-lockfile-refresh-logs-${{ github.run_id }}
          if-no-files-found: warn
          path: mobile/ci-pod-install.log

      - name: Validate generated lockfile scope
        run: |
          test -s mobile/Gemfile.lock
          test -s mobile/ios/Podfile.lock
          git diff --check
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(mobile/Gemfile\.lock|mobile/ios/Podfile\.lock)$' || true)"
          test -z "$unexpected"

      - name: Commit and push canonical lockfiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mobile/Gemfile.lock mobile/ios/Podfile.lock
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Refresh canonical iOS dependency lockfiles"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"${GITHUB_REF_NAME}"
