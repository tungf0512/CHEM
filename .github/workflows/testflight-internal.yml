name: TestFlight internal release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-internal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Archive and upload internal TestFlight build
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CHEM_BUNDLE_ID: ${{ vars.CHEM_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
    steps:
      - name: Validate Apple release configuration
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          missing=()
          [ -n "$CHEM_BUNDLE_ID" ] || missing+=(CHEM_BUNDLE_ID)
          [ -n "$APPLE_TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          [ -n "$APPSTORE_ISSUER_ID" ] || missing+=(APPSTORE_ISSUER_ID)
          [ -n "$APPSTORE_API_KEY_ID" ] || missing+=(APPSTORE_API_KEY_ID)
          [ -n "$APPSTORE_API_PRIVATE_KEY" ] || missing+=(APPSTORE_API_PRIVATE_KEY)
          [ -n "$APPSTORE_CERTIFICATES_FILE_BASE64" ] || missing+=(APPSTORE_CERTIFICATES_FILE_BASE64)
          [ -n "$APPSTORE_CERTIFICATES_PASSWORD" ] || missing+=(APPSTORE_CERTIFICATES_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub configuration names:"
            printf ' - %s\n' "${missing[@]}"
            echo "Add the names under repository Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
          echo "Apple release configuration names are present. Secret values are not printed."

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Jest
        working-directory: mobile
        run: npm test -- --runInBand

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Generate iOS Codegen artifacts
        working-directory: mobile
        run: npm run codegen:ios

      - name: Verify supported Xcode toolchain
        run: |
          set -euo pipefail
          xcode-select --print-path
          xcodebuild -version
          xcodebuild -showsdks | grep -q 'iphoneos'

      - name: Configure Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          working-directory: mobile
          bundler: "2.7.2"

      - name: Install committed Ruby and CocoaPods dependencies
        working-directory: mobile
        run: |
          set -euo pipefail
          BUNDLE_FROZEN=true bundle _2.7.2_ install --jobs 4 --retry 3
          BUNDLE_FROZEN=true bundle _2.7.2_ exec pod install --project-directory=ios
          git diff --exit-code -- Gemfile.lock ios/Podfile.lock

      - name: Import Apple Distribution certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ vars.CHEM_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Generate export options
        working-directory: mobile
        env:
          TEMPLATE_PATH: ios/ExportOptions.template.plist
          EXPORT_PATH: build/ExportOptions.plist
        run: |
          set -euo pipefail
          mkdir -p build
          python3 - "$TEMPLATE_PATH" "$EXPORT_PATH" "$CHEM_BUNDLE_ID" "$APPLE_TEAM_ID" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          template_path, export_path, bundle_id, team_id = sys.argv[1:]
          with Path(template_path).open('rb') as source:
              export_options = plistlib.load(source)
          export_options['teamID'] = team_id
          export_options['provisioningProfiles'] = {bundle_id: f'AppStore {bundle_id}'}
          with Path(export_path).open('wb') as destination:
              plistlib.dump(export_options, destination, sort_keys=False)
          PY
          plutil -lint "$EXPORT_PATH"

      - name: Archive and export signed internal build
        id: archive
        uses: Apple-Actions/xcodebuild@v1
        with:
          working-directory: mobile
          workspace: ios/CHEM.xcworkspace
          scheme: CHEM
          sdk: iphoneos
          configuration: Release
          action: archive
          archive-path: build/Archives/CHEM.xcarchive
          export-options-plist: build/ExportOptions.plist
          export-path: build/Export
          build-number: ${{ github.run_number }}
          build-settings: |
            CHEM_BUNDLE_ID=${{ vars.CHEM_BUNDLE_ID }}
            CHEM_BUILD_NUMBER=${{ github.run_number }}
            CHEM_GIT_COMMIT_SHA=${{ github.sha }}
            CHEM_RENDERER_BASELINE_VERSION=neutral-sdr-v1
            DEVELOPMENT_TEAM=${{ vars.APPLE_TEAM_ID }}
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY=Apple Distribution
            PROVISIONING_PROFILE_SPECIFIER=AppStore ${{ vars.CHEM_BUNDLE_ID }}
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=CHEM_INTERNAL_VALIDATION
          log-path: build/testflight-archive.log

      - name: Locate exported IPA
        id: locate_ipa
        working-directory: mobile
        run: |
          set -euo pipefail
          ipa_path="$(find build/Export -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          echo "ipa-path=$ipa_path" >> "$GITHUB_OUTPUT"
          echo "ipa-name=$(basename "$ipa_path")" >> "$GITHUB_OUTPUT"

      - name: Upload internal TestFlight build
        id: upload_testflight_build
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: mobile/${{ steps.locate_ipa.outputs.ipa-path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: false
          wait-for-processing: true

      - name: Preserve archive and export evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chem-testflight-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            mobile/build/Archives/
            mobile/build/Export/
            mobile/build/testflight-archive.log

      - name: Publish release summary
        if: always()
        env:
          IPA_NAME: ${{ steps.locate_ipa.outputs.ipa-name }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_testflight_build.outcome }}
        run: |
          {
            echo "## CHEM internal TestFlight release"
            echo
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Bundle ID: `%s`\n' "$CHEM_BUNDLE_ID"
            printf -- '- Marketing version: `0.1.0`\n'
            printf -- '- Build number: `%s`\n' "$GITHUB_RUN_NUMBER"
            printf -- '- IPA: `%s`\n' "${IPA_NAME:-not exported}"
            printf -- '- Archive/export: `%s`; upload: `%s`\n' "${ARCHIVE_OUTCOME:-not run}" "${UPLOAD_OUTCOME:-not run}"
            echo '- Secret values and signing material are intentionally omitted.'
          } >> "$GITHUB_STEP_SUMMARY"
